name: Release CLI (Go)

on:
  push:
    tags:
      - "cli/v*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: apps/cli/go.sum

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#cli/v}" >> $GITHUB_OUTPUT

      # The release body is this version's section of apps/cli/CHANGELOG.md
      # (everything under "## <version>" up to the next "## " heading), not
      # GoReleaser's commit log, which in this monorepo lists every commit since
      # the previous CLI tag, CLI-related or not.
      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v v="$VERSION" '
            /^## / { if (found) exit; sub(/[[:space:]]+$/, ""); found = ($0 == "## " v); next }
            found
          ' apps/cli/CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error file=apps/cli/CHANGELOG.md::No '## $VERSION' section (or it is empty). Add the release's changes to apps/cli/CHANGELOG.md, then delete and re-push the tag."
            exit 1
          fi
          cat "$notes"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean --skip=validate --release-notes=${{ runner.temp }}/release-notes.md
          workdir: apps/cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          CLI_VERSION: ${{ steps.version.outputs.version }}
