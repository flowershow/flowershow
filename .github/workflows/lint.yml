name: Lint

on:
  pull_request:
    branches:
      - main
      - staging
    paths:
      - '**'
      - '!content/**'
      # imported by apps/flowershow/lib/preview-canvas.ts
      - 'content/flowershow-app/docs/canvas-demo.canvas'
  push:
    branches:
      - staging
    paths:
      - '**'
      - '!content/**'
      # imported by apps/flowershow/lib/preview-canvas.ts
      - 'content/flowershow-app/docs/canvas-demo.canvas'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Run ESLint
        run: pnpm lint
