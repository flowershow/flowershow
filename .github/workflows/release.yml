name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: release-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: pnpm install

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # changesets creates a GitHub release for each npm package it publishes
      # (e.g. @flowershow/remark-wiki-link@x.y.z), and GitHub marks the newest one
      # as "Latest". The CLI install script fallback, `fl` update check and docs
      # (releases/latest/download/fl_*.tar.gz) expect "Latest" to be a CLI
      # release, so point it back at the newest cli/v* release.
      - name: Keep newest CLI release marked as Latest
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --exclude-drafts --exclude-pre-releases --json tagName --jq '[.[] | select(.tagName | startswith("cli/v"))][0].tagName // empty')
          if [ -n "$tag" ]; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --latest
            echo "Marked $tag as Latest"
          else
            echo "No cli/v* release found; leaving Latest unchanged"
          fi
