name: Issue Triage

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  triage:
    # Auto-triage every new issue; also run on demand when a trusted
    # collaborator comments "/triage" on an existing issue (not a PR).
    if: >-
      github.event_name == 'issues' ||
      ( github.event_name == 'issue_comment' &&
        !github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/triage') )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Authorize trigger
        id: check
        uses: actions/github-script@v8
        with:
          script: |
            // Manual "/triage": only repo collaborators with triage/write access
            // or above may run it. This is what blocks people outside the org.
            if (context.eventName === 'issue_comment') {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.payload.comment.user.login,
              });
              const level = data.role_name || data.permission;
              return ['admin', 'maintain', 'write', 'triage'].includes(level);
            }
            // Auto-triage on open: skip brand-new accounts as a light spam guard.
            const user = await github.rest.users.getByUsername({
              username: context.payload.issue.user.login,
            });
            const created = new Date(user.data.created_at);
            const days = (Date.now() - created) / (1000 * 60 * 60 * 24);
            return days >= 30;
          result-encoding: string

      - uses: actions/checkout@v6
        if: steps.check.outputs.result == 'true'
        with:
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        if: steps.check.outputs.result == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          model: ${{ secrets.OPENCODE_MODEL || 'anthropic/claude-sonnet-4-20250514' }}
          share: false
          prompt: |
            Triage this issue by running the `triage` skill
            (invoke: skill({ name: "triage" })) and following it exactly.
            The skill runs unattended. Decide the category and state, then
            APPLY them yourself with `gh` as the skill's "Applying the
            decision" section instructs: set the issue type via
            `gh api --method PATCH` and add exactly one state label with
            `gh issue edit`. A later step verifies this and FAILS the job if
            the issue type or state label is missing — so you must actually
            run the commands, not just describe the decision.

            Then write your triage comment as your FINAL message — this action
            posts that message as the single issue comment. It MUST begin with
            the exact line:
              > *This was generated by AI during triage.*
            and contain only the comment: no preamble, no "done" summary, no
            narration of the steps you took. Do NOT post the comment yourself
            with `gh issue comment` (that duplicates it), do not wait for or
            ask a human, do not write repo files, and do not close the issue.

      # Deterministic post-processing. Two jobs, both independent of whether
      # the model behaved:
      #   1. Clean the posted comment — the action posts the model's final
      #      message verbatim, so strip any leaked preamble before the
      #      disclaimer line.
      #   2. Verify the model actually applied a type + exactly one state
      #      label, and fail the job if not so misses are visible, not silent.
      - name: Clean up and verify triage
        if: steps.check.outputs.result == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const STATE_LABELS = ['needs-triage', 'needs-info', 'ready-for-agent', 'ready-for-human', 'wontfix'];
            const DISCLAIMER = '> *This was generated by AI during triage.*';

            // 1. Clean the comment opencode just posted (newest bot comment):
            //    strip anything before the disclaimer line.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const botComments = comments.filter(c => c.user && c.user.login === 'opencode-agent[bot]');
            if (botComments.length === 0) {
              core.warning('No opencode triage comment found to clean up.');
            } else {
              const comment = botComments.reduce((a, b) => (b.id > a.id ? b : a));
              const original = comment.body || '';
              const di = original.indexOf(DISCLAIMER);
              if (di > 0) {
                const body = original.slice(di).trimEnd() + '\n';
                await github.rest.issues.updateComment({ owner, repo, comment_id: comment.id, body });
                core.info('Stripped leaked preamble from triage comment.');
              } else if (di < 0) {
                core.warning('Triage comment does not contain the expected disclaimer line.');
              }
            }

            // 2. Verify the model applied the decision; fail the job if not.
            const issue = await github.rest.issues.get({ owner, repo, issue_number });
            const type = issue.data.type ? issue.data.type.name : null;
            const labels = issue.data.labels.map(l => (typeof l === 'string' ? l : l.name));
            const states = labels.filter(n => STATE_LABELS.includes(n));

            const problems = [];
            if (!type) problems.push('issue type is not set');
            if (states.length === 0) problems.push('no state label applied');
            if (states.length > 1) problems.push(`multiple state labels applied (${states.join(', ')})`);

            if (problems.length) {
              core.setFailed(`Triage incomplete — the agent did not apply its decision: ${problems.join('; ')}.`);
            } else {
              core.info(`Triage verified: type=${type}, state=${states[0]}.`);
            }