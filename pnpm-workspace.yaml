packages:
  - "apps/*"
  - "packages/*"

# Single source of truth for versions shared across workspace packages.
# vitest patches a shared global chai instance, so every package MUST resolve
# the exact same vitest version — a skew loads duplicate @vitest/expect copies
# that double-patch chai and break `.toThrow` assertions. Keep these in sync.
catalog:
  vitest: ^3.2.7
  "@vitest/browser": ^3.2.7
  "@vitest/coverage-v8": ^3.2.7
